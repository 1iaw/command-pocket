name: CommandPocket
options:
  bundleIdPrefix: com.1iaw
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  CommandPocket:
    type: application
    platform: macOS
    sources:
      - Sources/CommandPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.1iaw.CommandPocket
        PRODUCT_NAME: CommandPocket
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: 命令口袋
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - CommandPocketTests
  CommandPocketTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/CommandPocketTests
    dependencies:
      - target: CommandPocket

